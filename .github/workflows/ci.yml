name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # global.json pins 10.0.401 with rollForward: latestFeature.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Vendored sqlite-vec ships native/sqlite-vec/linux-x64, so the real
      # extension loads on this runner; no Ollama or network is required.
      - name: Build, test, format
        run: bash scripts/verify.sh

      - name: Verification ledger
        run: bash scripts/check-ledger.sh
